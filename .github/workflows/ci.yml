name: CI

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  standalone: true
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  standalone: true
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint

    type-check:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  standalone: true
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm check

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  standalone: true
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build

    lighthouse:
        name: Lighthouse
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 20
            - uses: pnpm/action-setup@v4
              with:
                  standalone: true
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm lighthouse
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lighthouse-reports
                  path: .lighthouseci/
                  retention-days: 14
