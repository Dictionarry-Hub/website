name: deploy
on:
  push:
    branches: ["v3"]
  repository_dispatch:
    types: [database-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: npm ci
      - run: npm run db:stable  # Fetch database
      - run: npm run build       # Build site
      
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - uses: actions/deploy-pages@v4