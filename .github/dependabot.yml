# .github/dependabot.yml
version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 10
      reviewers:
          - 'santiagosayshey'
      labels:
          - 'dependencies'
