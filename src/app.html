<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<link
			rel="icon"
			type="image/png"
			href="/favicon-96x96.png"
			sizes="96x96" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg" />
		<link
			rel="shortcut icon"
			href="/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png" />
		<meta
			name="apple-mobile-web-app-title"
			content="Dictionarry" />
		<link
			rel="manifest"
			href="/site.webmanifest" />
		<meta
			name="description"
			content="Documentation and resources for the Dictionarry media automation project." />
		<meta
			name="theme-color"
			content="#597B91" />
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:site_name"
			content="Dictionarry" />
		<meta
			property="og:title"
			content="Dictionarry" />
		<meta
			property="og:description"
			content="Documentation and resources for the Dictionarry media automation project." />
		<meta
			property="og:image"
			content="https://raw.githubusercontent.com/Dictionarry-Hub/dictionarry.dev/develop/static/icon.png" />
		<meta
			name="twitter:card"
			content="summary" />
		<meta
			name="twitter:title"
			content="Dictionarry" />
		<meta
			name="twitter:description"
			content="Documentation and resources for the Dictionarry media automation project." />
		<meta
			name="twitter:image"
			content="https://raw.githubusercontent.com/Dictionarry-Hub/dictionarry.dev/develop/static/icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
