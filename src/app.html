<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bitter:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Darker+Grotesque:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Martian+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Overpass:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700&display=swap" />
		<link
			rel="icon"
			type="image/png"
			href="/favicon-96x96.png"
			sizes="96x96" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg" />
		<link
			rel="shortcut icon"
			href="/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png" />
		<meta
			name="apple-mobile-web-app-title"
			content="Dictionarry" />
		<link
			rel="manifest"
			href="/site.webmanifest" />
		<script>
			// Deliberately list-free: an unknown stored name sets an attribute
			// no theme CSS matches, which falls back to :root (light), the same
			// outcome validation would produce. Themes are registered in
			// src/lib/client/ui/theme/themes.ts; this file never changes.
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t && t !== 'system' && t !== 'light') {
						document.documentElement.setAttribute('data-theme', t);
					} else if (!t || t === 'system') {
						if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
							document.documentElement.setAttribute('data-theme', 'dark');
						}
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
